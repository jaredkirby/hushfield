<!doctype html><html lang="en"><meta charset="utf-8"><title>Hushfield piece audio QA</title><style>body{background:#000;color:#fff;font:14px/1.6 monospace;padding:30px}button{font:inherit;padding:12px}pre{white-space:pre-wrap}</style><h1>One-piece audio QA</h1><button id="run">Run offline checks</button><pre id="results">Ready. No live audio output.</pre><script type="module">
import {createPieceSpace} from './piece-space.mjs';
import {createSoundState} from './sound-patches.mjs';
const results=document.getElementById('results'),button=document.getElementById('run');
const rms=values=>Math.sqrt(values.reduce((sum,value)=>sum+value*value,0)/values.length);
function check(condition,label){if(!condition)throw new Error(label);results.textContent+='PASS '+label+'\n';}
function processorReady(node){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Processor did not acknowledge readiness within two seconds')),2000);node.port.onmessage=({data})=>{if(data.type==='ready'){clearTimeout(timer);resolve();}};});}
// Offline audio can outrun MessagePort dispatch. Yield while suspended, as in qa-synth.
const settleMessages=()=>new Promise(resolve=>setTimeout(resolve,20));
async function tone(cutoff,width=100,side=false){
 const context=new OfflineAudioContext(2,48000,48000),bus=createPieceSpace(context,context.destination);
 bus.filter.frequency.value=cutoff;bus.filter.Q.value=.5;bus.wet.gain.value=0;bus.setWidth(width);
 const source=context.createOscillator();source.frequency.value=1200;
 if(side){const merger=context.createChannelMerger(2),invert=context.createGain();invert.gain.value=-1;source.connect(merger,0,0);source.connect(invert);invert.connect(merger,0,1);merger.connect(bus.input);}else source.connect(bus.input);
 source.start();return context.startRendering();
}
async function texture(){
 const context=new OfflineAudioContext(2,96000,48000);
 await context.audioWorklet.addModule('./build/ambient-worklet.js?v=piece-4');await context.audioWorklet.addModule('./build/grain-worklet.js?v=piece-4');
 const foundation=new AudioWorkletNode(context,'ambient-engine',{numberOfInputs:0,outputChannelCount:[2],processorOptions:{playing:true,settings:{hold:true,pads:100,air:0,melody:0}}});
 const grains=new AudioWorkletNode(context,'grain-engine',{numberOfInputs:1,outputChannelCount:[2],processorOptions:{source:'foundation',playing:true,params:{size:300,density:24,position:.5,width:100,spray:20}}});
 grains.port.postMessage({type:'source',mode:'foundation'});grains.port.postMessage({type:'params',params:{size:300,density:24,position:.5,width:100,spray:20}});grains.port.postMessage({type:'play',value:true});
 foundation.connect(grains);grains.connect(context.destination);return context.startRendering();
}
async function harmony(){
 const context=new OfflineAudioContext(2,48000,48000);
 await context.audioWorklet.addModule('./build/ambient-worklet.js?v=piece-4');await context.audioWorklet.addModule('./build/orbit-worklet.js?v=piece-4');
 const foundation=new AudioWorkletNode(context,'ambient-engine',{numberOfInputs:0,outputChannelCount:[2],processorOptions:{playing:true,settings:{hold:true,key:2,scale:0}}});
 const patches=createSoundState();Object.assign(patches.triggers.base,{wave:'sine',attack:.002,decay:.01,sustain:100,gate:2,cutoff:20000,pan:0});
 const motion=new AudioWorkletNode(context,'orbit-engine',{numberOfInputs:0,numberOfOutputs:12,outputChannelCount:Array(12).fill(2),processorOptions:{patches}});
 const channel=new MessageChannel();
 const ready=Promise.all([processorReady(foundation),processorReady(motion)]);
 const silent=context.createGain();silent.gain.value=0;foundation.connect(silent);silent.connect(context.destination);motion.connect(context.destination,6);
 const firstPause=context.suspend(.1),secondPause=context.suspend(.2),render=context.startRendering();await Promise.all([firstPause,ready]);
 motion.port.postMessage({type:'harmonyPort',port:channel.port2},[channel.port2]);foundation.port.postMessage({type:'harmonyPort',port:channel.port1},[channel.port1]);motion.port.postMessage({type:'followHarmony',value:true});
 await settleMessages();
 await context.resume();await secondPause;
 motion.port.postMessage({type:'audition',bank:'triggers',index:0,midi:64});await settleMessages();await context.resume();const audio=await render;
 const values=audio.getChannelData(0).slice(12000,42000);let crossings=0;for(let i=1;i<values.length;i++)if(values[i-1]<0&&values[i]>=0)crossings++;
 return {pitch:crossings/(values.length/48000),level:rms(values),crossings};
}
button.onclick=async()=>{button.disabled=true;results.textContent='';try{
 const live=await texture();check(rms(live.getChannelData(0).slice(48000))>.002,'Foundation supplies audible live Texture with no audible dry Foundation or loaded sample');
 const bright=await tone(10000),dark=await tone(100);const brightEnergy=rms(bright.getChannelData(0).slice(12000)),darkEnergy=rms(dark.getChannelData(0).slice(12000));check(darkEnergy<brightEnergy*.02,'shared tone attenuates every part entering the piece bus');
 const wide=await tone(10000,100,true),mono=await tone(10000,0,true);check(rms(wide.getChannelData(0).slice(12000))>.3&&rms(mono.getChannelData(0).slice(12000))<.001,'shared width collapses opposite-phase stereo to mono');
 const {pitch,level,crossings}=await harmony();check(Math.abs(pitch-349.228)<4&&level>.001,'Motion receives D-minor harmony directly from Foundation processors without a main-thread harmony callback ('+pitch.toFixed(1)+' Hz, expected 349.2 Hz; RMS '+level.toFixed(4)+'; '+crossings+' crossings)');
 check([live,bright,dark,wide,mono].every(audio=>[0,1].every(ch=>audio.getChannelData(ch).every(Number.isFinite))),'all rendered stereo buffers are finite');
 results.textContent+='\n5 CHECKS PASSED';document.body.dataset.result='passed';
 }catch(error){results.textContent+='FAIL '+error.message;document.body.dataset.result='failed';}finally{button.disabled=false;}};
</script></html>
