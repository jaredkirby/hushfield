<!doctype html><meta charset="utf-8"><title>Audio visual verification</title><body style="background:#000;color:#fff;font:13px monospace"><h1>Audio visual verification</h1><button id="run">Run analysis checks</button><pre id="results">Ready to check stereo analysers.</pre><canvas id="scope" width="374" height="180"></canvas><canvas id="spectrum" width="374" height="180"></canvas><canvas id="vector" width="374" height="180"></canvas><script type="module">
import {createVisualCapture,stereoMetrics,VISUAL_DEFAULTS,spectrumBands} from './visual-analysis.mjs?v=hushfield-1';import {createVisualRenderer} from './audio-visuals.mjs?v=hushfield-1';
const results=document.getElementById('results'),lines=[];const check=(ok,text)=>{if(!ok)throw Error(text);lines.push('PASS '+text);results.textContent=lines.join('\n');};
document.getElementById('run').onclick=async()=>{try{const ctx=new AudioContext(),activation=ctx.resume(),buffer=ctx.createBuffer(2,ctx.sampleRate,ctx.sampleRate);for(let i=0;i<buffer.length;i++){buffer.getChannelData(0)[i]=Math.sin(i*2*Math.PI*440/ctx.sampleRate)*.4;buffer.getChannelData(1)[i]=Math.sin(i*2*Math.PI*880/ctx.sampleRate)*.1;}const source=ctx.createBufferSource();source.buffer=buffer;source.loop=true;const quiet=ctx.createGain();quiet.gain.value=.02;source.connect(quiet);quiet.connect(ctx.destination);const capture=createVisualCapture(ctx,source);source.start();await activation;await new Promise(resolve=>setTimeout(resolve,450));const data=capture.read(0);source.stop();capture.dispose();await ctx.close();check(Math.abs(stereoMetrics(data.left,data.right).correlation)<.03,'Distinct left/right PCM is preserved by the real analysers');const rms=a=>Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length);check(rms(data.left)>rms(data.right)*3.8,'Channel splitter retains the different left and right levels');check(Math.abs(rms(data.left)-.4/Math.SQRT2)<.005&&Math.abs(rms(data.right)-.1/Math.SQRT2)<.005,'Captured stereo samples retain their expected amplitude');check(Math.max(...data.db)>-30,'Stereo spectrum contains the input tones');
const timings=[];for(const mode of ['scope','spectrum','vector']){const canvas=document.getElementById(mode),c=canvas.getContext('2d',{willReadFrequently:true}),renderer=createVisualRenderer(),times=[];for(let i=0;i<30;i++){const start=performance.now();renderer.draw({c,w:canvas.width,h:canvas.height},data,{...VISUAL_DEFAULTS,mode},1/60);times.push(performance.now()-start);}const pixels=c.getImageData(0,0,canvas.width,canvas.height).data;check(pixels.every((v,i)=>i%4===3?v===255:v===0||v===255),mode+' uses only opaque black/white pixels');check(pixels.filter((v,i)=>i%4===0&&v===255).length>300,mode+' draws visible signal and graticule');timings.push({mode,meanMs:times.reduce((a,b)=>a+b,0)/times.length,p95Ms:times.sort((a,b)=>a-b)[28]});}results.textContent+='\n\n'+JSON.stringify(timings,null,2)+'\nALL VISUAL CHECKS PASSED';document.body.dataset.result='passed';}catch(error){results.textContent+='\nFAIL '+error.stack;document.body.dataset.result='failed';}};
</script></body>
