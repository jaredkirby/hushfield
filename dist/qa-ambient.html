<!doctype html><html lang="en"><meta charset="utf-8"><title>Ambient audio verification</title><body style="background:#000;color:#fff;font:14px monospace;padding:24px"><h1>Ambient audio verification</h1><pre id="results">Rendering the real ambient AudioWorklet…</pre><script type="module">
import {AMBIENT_DEFAULTS,AMBIENT_SCENES} from './ambient-settings.mjs?v=hushfield-1';
import {createOrbitAudio} from './orbit-audio.mjs?v=hushfield-1';
import {restorePoints} from './ambient-points.mjs?v=hushfield-1';
import {createSoundState,patchFor} from './sound-patches.mjs?v=hushfield-1';
const out=document.getElementById('results'),results=[];const check=(v,label)=>{if(!v)throw Error(label);results.push('PASS '+label);out.textContent=results.join('\n');};const rms=a=>Math.sqrt(a.reduce((s,x)=>s+x*x,0)/a.length);
async function render(scene,pads=72){const ctx=new OfflineAudioContext(2,24000*8,24000);await ctx.audioWorklet.addModule('./build/ambient-worklet.js?v=hushfield-1');await ctx.audioWorklet.addModule('./build/tape-worklet.js?v=hushfield-1');const node=new AudioWorkletNode(ctx,'ambient-engine',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2],processorOptions:{settings:{...AMBIENT_DEFAULTS,...AMBIENT_SCENES[scene],scene,pads,melody:pads?38:0,air:pads?14:0},playing:true}}),tape=new AudioWorkletNode(ctx,'tape-delay',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[2]});node.onprocessorerror=()=>{out.textContent+='\nAMBIENT PROCESSOR ERROR';};node.connect(tape);tape.connect(ctx.destination);node.port.postMessage({type:'settings',value:{...AMBIENT_DEFAULTS,...AMBIENT_SCENES[scene],scene,pads,melody:pads?38:0,air:pads?14:0}});node.port.postMessage({type:'play',value:true});tape.port.postMessage({tapeOn:true,drive:35,delayTime:.42,feedback:40,delayMix:20,wow:20,flutter:10,hiss:0,tapeTone:40});const buffer=await ctx.startRendering();return [buffer.getChannelData(0),buffer.getChannelData(1)];}
try{const base=await render(0);check(base.every(c=>c.every(Number.isFinite)),'Ambient + tape worklets render finite stereo PCM');check(rms(base[0])>.008,'One tap produces audible ambient sound without a sample (RMS '+rms(base[0]).toFixed(6)+')');check(rms(base[0].map((v,i)=>v-base[1][i]))>.001,'Pad and melody layers produce stereo movement');const scene=await render(3);check(rms(base[0].map((v,i)=>v-scene[0][i]))>.008,'Different scenes change the rendered music');const muted=await render(0,0);check(rms(muted[0])===0,'Muting the generator layers renders silence');
 const ctx=new OfflineAudioContext(2,24000,24000),mutedBus=ctx.createGain();mutedBus.gain.value=0;mutedBus.connect(ctx.destination);const state=createSoundState(),synth=createOrbitAudio(ctx,mutedBus,state,ctx.destination);synth.play('balls',0,60,patchFor(state,'balls',0),true);const audition=await ctx.startRendering();check(rms(audition.getChannelData(0))>.001,'Manual sound auditions remain audible with the ORBIT layer muted');const gesturePoints=restorePoints();gesturePoints[0]={x:.92,y:.18};
 const gestureContext=new OfflineAudioContext(2,24000*4,24000);await gestureContext.audioWorklet.addModule('./build/ambient-worklet.js?v=hushfield-1');
 const gestureNode=new AudioWorkletNode(gestureContext,'ambient-engine',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2],processorOptions:{settings:{...AMBIENT_DEFAULTS,activity:0,melody:0,air:0},playing:true}});let gestureStatus;gestureNode.port.onmessage=({data})=>{if(data.chordNotes)gestureStatus=data;};gestureNode.connect(gestureContext.destination);const suspended=gestureContext.suspend(1),rendering=gestureContext.startRendering();await suspended;gestureNode.port.postMessage({type:'points',value:gesturePoints});await gestureContext.resume();const gestureAudio=await rendering;check(rms(gestureAudio.getChannelData(0))>.004&&gestureAudio.getChannelData(0).every(Number.isFinite),'A live dot movement renders audible finite PCM in the real worklet');check(gestureStatus?.chordNotes?.[0]===41&&Math.abs(gestureStatus.voicePans[0]-.84)<.001,'Real worklet applies moved voice F2 and 84% right pan');check(Number.isFinite(gestureStatus.audioTime)&&gestureStatus.motionTime>3.5,'Real worklet publishes audio-clock anchors for smooth animation');
 out.textContent+='\n\nALL AMBIENT AUDIO CHECKS PASSED';document.body.dataset.result='passed';}catch(e){out.textContent+='\nFAIL '+e.message;document.body.dataset.result='failed';}
</script></body></html>
