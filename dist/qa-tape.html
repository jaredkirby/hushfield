<!doctype html><html lang="en"><meta charset="utf-8"><title>Tape audio verification</title><style>body{background:#000;color:#fff;font:14px/1.6 monospace;padding:24px}button{font:inherit;padding:10px}pre{white-space:pre-wrap}</style><h1>Tape audio verification</h1><button id="run">Run offline Tape checks</button><pre id="results">No live audio output.</pre><script type="module">
import {TAPE_DEFAULTS} from './tape-settings.mjs';
import {createPieceSpace} from './piece-space.mjs';
const out=document.getElementById('results'),button=document.getElementById('run');
const rms=a=>Math.sqrt(a.reduce((sum,value)=>sum+value*value,0)/a.length);
const check=(condition,label)=>{if(!condition)throw Error(label);out.textContent+='PASS '+label+'\n';};
async function render(rate,enabled,change=false,reference=false){
 const context=new OfflineAudioContext(2,rate*3,rate);
 await context.audioWorklet.addModule('./build/tape-worklet.js?v=tape-1');
 const tape=new AudioWorkletNode(context,'tape-delay',{numberOfInputs:1,outputChannelCount:[2],processorOptions:{params:{...TAPE_DEFAULTS,tapeOn:enabled,hiss:0}}});
 const bus=createPieceSpace(context,reference?context.destination:tape);bus.filter.frequency.value=14000;bus.filter.Q.value=.6;bus.setWidth(100);bus.wet.gain.value=0;if(!reference)tape.connect(context.destination);
 const buffer=context.createBuffer(2,rate*3,rate);
 for(let c=0;c<2;c++){const data=buffer.getChannelData(c);for(let i=0;i<data.length;i++){const t=i/rate;data[i]=t<(change?2.5:1.1)?(.07*Math.sin(2*Math.PI*220*t)+.025*Math.sin(2*Math.PI*330*t))*(c?.9:1):0;}}
 const source=context.createBufferSource();source.buffer=buffer;source.connect(bus.input);source.start();
 let pause;if(change)pause=context.suspend(.6);
 const rendering=context.startRendering();if(change){await pause;tape.port.postMessage({...TAPE_DEFAULTS,tapeOn:false,hiss:0});await new Promise(resolve=>setTimeout(resolve,20));await context.resume();}
 const result=await rendering;return [result.getChannelData(0),result.getChannelData(1)];
}
button.onclick=async()=>{button.disabled=true;out.textContent='';try{for(const rate of [44100,48000]){
 const dry=await render(rate,false),warm=await render(rate,true),reference=await render(rate,false,false,true),switched=await render(rate,true,true),continuous=await render(rate,false,true,true);
 check(warm.every(ch=>ch.every(Number.isFinite))&&rms(warm[0])>.001,rate+' Hz: constructor settings enable audible finite stereo Tape on cold start');
 check(rms(dry[0].map((value,i)=>value-reference[0][i]*.75))<1e-7,rate+' Hz: Off is a true shared-path bypass at the dry reference level');
 const start=Math.round(rate*.3),end=Math.round(rate*1.0),difference=rms(warm[0].slice(start,end).map((value,i)=>value-dry[0][i+start]))/rms(dry[0].slice(start,end));
 check(difference>.2,rate+' Hz: default coloration and movement produce a clear PCM change ('+(difference*100).toFixed(1)+'% relative difference)');
 check(rms(warm[0].slice(Math.round(rate*1.4),Math.round(rate*1.65)))>1e-5&&rms(dry[0].slice(Math.round(rate*1.4)))<1e-8,rate+' Hz: On produces repeats while Off has no echo tail');
 const mismatch=rms(switched[0].slice(rate,rate*2).map((value,i)=>value-continuous[0][i+rate]*.75));
 check(mismatch<1e-7,rate+' Hz: a real processor toggle returns to bypass after its smooth transition');
 }
 out.textContent+='\n10 TAPE CHECKS PASSED';document.body.dataset.result='passed';}catch(error){out.textContent+='FAIL '+error.message;document.body.dataset.result='failed';}finally{button.disabled=false;}};
</script></html>
