<!doctype html><html lang="en"><meta charset="utf-8"><title>Tape audio verification</title><body style="background:#000;color:#fff;font:14px monospace;padding:24px"><h1>Tape audio verification</h1><pre id="results">Rendering the real tape AudioWorklet…</pre><script type="module">
import {createOrbitAudio} from './orbit-audio.mjs?v=hushfield-1';
import {createSoundState,patchFor} from './sound-patches.mjs?v=hushfield-1';
const out=document.getElementById('results'),results=[];
const check=(condition,label)=>{if(!condition)throw Error(label);results.push('PASS '+label);out.textContent=results.join('\n');};
const rms=(a,start=0,end=a.length)=>Math.sqrt(a.slice(start,end).reduce((sum,x)=>sum+x*x,0)/(end-start));
async function render(bank,tapeOn){const ctx=new OfflineAudioContext(2,48000*2,48000);await ctx.audioWorklet.addModule('./tape-worklet.js?v=hushfield-1');const tape=new AudioWorkletNode(ctx,'tape-delay',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[2]});tape.port.postMessage({tapeOn,delayTime:.2,feedback:50,delayMix:60,drive:60,wow:50,flutter:30,hiss:0,tapeTone:40});tape.connect(ctx.destination);const state=createSoundState();Object.assign(state[bank].base,{attack:.005,decay:.03,sustain:0,gate:.01,release:.04,delaySend:0,reverbSend:0});const synth=createOrbitAudio(ctx,tape,state);synth.play(bank,0,60,patchFor(state,bank,0));const b=await ctx.startRendering();return [b.getChannelData(0),b.getChannelData(1)];}
try{for(const bank of ['triggers','balls']){const clean=await render(bank,false),warm=await render(bank,true);check(warm.every(c=>c.every(Number.isFinite)),bank+' real tape worklet renders finite stereo PCM');check(rms(warm[0],0,8000)>.0001,bank+' source remains audible');check(rms(warm[0],9600,18000)>.00001,bank+' reaches the shared tape delay repeat');check(rms(warm[0].map((v,i)=>v-clean[0][i]))>.0001,bank+' tape switch changes PCM');check(rms(warm[0],80000,96000)<rms(warm[0],0,8000)*.05,bank+' feedback tail decays');}out.textContent+='\n\nALL TAPE AUDIO CHECKS PASSED';document.body.dataset.result='passed';}catch(e){out.textContent+='\nFAIL '+e.message;document.body.dataset.result='failed';}
</script></body></html>
