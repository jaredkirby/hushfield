<!doctype html><meta charset="utf-8"><title>Ambient animation verification</title><body style="background:black;color:white;font:14px monospace"><h1>Ambient animation verification</h1><pre id="results">Measuring renderer…</pre><canvas id="canvas"></canvas><script type="module">
